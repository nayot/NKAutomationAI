[project]
name = "edoc-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright",
    "python-dotenv",
    "anthropic",
    "json-repair",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "rich>=13.7",
]

[project.scripts]
edoc = "edoc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edoc"]
