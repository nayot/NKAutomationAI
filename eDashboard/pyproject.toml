[project]
name = "edashboard"
version = "0.1.0"
description = "CLI dashboard for pending tasks across Gmail, eDoc, eSign, and Fiori"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "readchar>=4.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
edashboard = "edashboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
